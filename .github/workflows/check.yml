# 校验技能格式、版本与更新日期；只用 runner 自带的 sh、awk、grep 与 git。
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: sh scripts/skills.sh check --git
